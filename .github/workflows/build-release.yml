# .github/workflows/build-release.yml
name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: todo-app
            asset_name: todo-app-linux-amd64
          - os: macos-latest
            artifact_name: todo-app
            asset_name: todo-app-macos-amd64
          - os: windows-latest
            artifact_name: todo-app.exe
            asset_name: todo-app-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p artifacts
        cp build/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
        chmod +x artifacts/${{ matrix.asset_name }}

    - name: Prepare (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir artifacts
        copy build\Release\${{ matrix.artifact_name }} artifacts\${{ matrix.asset_name }}

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: artifacts/${{ matrix.asset_name }}

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Get version
      id: version
      run: |
        echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT
        echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ steps.version.outputs.date }}-${{ steps.version.outputs.sha }}
        name: Build ${{ steps.version.outputs.date }}
        files: |
          artifacts/todo-app-linux-amd64/todo-app-linux-amd64
          artifacts/todo-app-macos-amd64/todo-app-macos-amd64
          artifacts/todo-app-windows-amd64.exe/todo-app-windows-amd64.exe
