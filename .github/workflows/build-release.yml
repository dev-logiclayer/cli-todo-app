# .github/workflows/build-release.yml
name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-release:
    # Skip if commit message contains [skip ci] or [ci skip]
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: todo-app
            asset_name: todo-app-linux-amd64
          - os: macos-latest
            artifact_name: todo-app
            asset_name: todo-app-macos-amd64
          - os: windows-latest
            artifact_name: todo-app.exe
            asset_name: todo-app-windows-amd64.exe

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up CMake
      uses: jwlawson/actions-setup-cmake@v1.14
      with:
        cmake-version: '3.25.x'

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare artifact (Linux/Mac)
      if: matrix.os != 'windows-latest'
      run: |
        mkdir -p artifacts
        cp build/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
        chmod +x artifacts/${{ matrix.asset_name }}

    - name: Prepare artifact (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir artifacts
        copy build\Release\${{ matrix.artifact_name }} artifacts\${{ matrix.asset_name }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: artifacts/${{ matrix.asset_name }}

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Display structure of downloaded files
      run: ls -R artifacts

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Get short SHA
      id: sha
      run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: build-${{ steps.date.outputs.date }}-${{ steps.sha.outputs.sha }}
        release_name: Auto Build ${{ steps.date.outputs.date }}
        body: |
          ## 🚀 Automated Build Release
          
          **Build Date:** ${{ steps.date.outputs.date }}
          **Commit:** ${{ steps.sha.outputs.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ### 📦 Downloads
          Download the appropriate binary for your platform below.
          
          ### ✨ Features
          - ✅ Add, view, delete, and manage tasks
          - ✅ Task priorities (High, Medium, Low)
          - ✅ Categories and due dates
          - ✅ Search functionality
          - ✅ Persistent storage
          - ✅ Colorful CLI interface
          - ✅ Full-width terminal headers
          
          ### 🔧 Installation
          
          **Linux/macOS:**
```bash
          chmod +x todo-app-*
          ./todo-app-*
```
          
          **Windows:**
```cmd
          todo-app-windows-amd64.exe
```
          
          ---
          💡 **Tip:** Add `[skip ci]` to your commit message to skip automatic builds.
          
          🔗 **Commit:** ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false
        files: |
          artifacts/todo-app-linux-amd64/todo-app-linux-amd64
          artifacts/todo-app-macos-amd64/todo-app-macos-amd64
          artifacts/todo-app-windows-amd64.exe/todo-app-windows-amd64.exe
