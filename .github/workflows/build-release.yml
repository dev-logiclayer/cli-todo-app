name: Build and Release

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
            platform: linux
            artifact_name: todo-app
          - os: ubuntu-latest
            arch: arm64
            platform: linux
            artifact_name: todo-app
          - os: macos-latest
            arch: amd64
            platform: macos
            artifact_name: todo-app
          - os: windows-latest
            arch: amd64
            platform: windows
            artifact_name: todo-app.exe

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Install ARM64 Cross-Compiler
      if: matrix.platform == 'linux' && matrix.arch == 'arm64'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

    - uses: jwlawson/actions-setup-cmake@v2
      with:
        cmake-version: '3.25.x'

    - name: Configure CMake
      run: |
        if [ "${{ matrix.platform }}" = "linux" ] && [ "${{ matrix.arch }}" = "arm64" ]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
          -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release
        fi
      shell: bash

    - name: Build
      run: cmake --build build --config Release

    - name: Prepare Artifacts
      shell: bash
      run: |
        mkdir -p out
        # ফাইল নেমিং কনভেনশন: app-v1.0.0-linux-arm64
        ASSET_NAME="todo-app-${{ matrix.platform }}-${{ matrix.arch }}"
        if [ "${{ matrix.platform }}" = "windows" ]; then
          cp build/Release/${{ matrix.artifact_name }} out/${ASSET_NAME}.exe
        else
          cp build/${{ matrix.artifact_name }} out/${ASSET_NAME}
          chmod +x out/${ASSET_NAME}
        fi
        echo "final_asset_name=$(ls out/)" >> $GITHUB_ENV

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ env.final_asset_name }}
        path: out/${{ env.final_asset_name }}

  release:
    needs: build-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        path: all-artifacts
        merge-multiple: true

    - name: Set Release Metadata
      id: meta
      run: |
        # এখানে আপনি আপনার পছন্দমতো ফরম্যাট সেট করতে পারেন
        # উদাহরন: v2026.01.04.1234
        echo "version=v$(date +'%Y%m%d')-$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        echo "friendly_date=$(date +'%B %d, %Y')" >> $GITHUB_OUTPUT

    - uses: softprops/action-gh-release@v2
      with:
        # রিলিজের নাম এখন হবে "Production Release - January 04, 2026"
        # ট্যাগের নাম হবে "v20260104-sha"
        tag_name: ${{ steps.meta.outputs.version }}
        name: "App Release - ${{ steps.meta.outputs.friendly_date }}"
        draft: false
        prerelease: false
        files: all-artifacts/*
